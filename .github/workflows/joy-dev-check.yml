name: Joy Dev Checks
run-name: Joy Dev Check · ${{ inputs.project_id }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Stable request ID used by Joy to locate this run
        required: true
        type: string
      project_id:
        description: Joy project ID that owns this development session
        required: true
        type: string
      suite:
        description: Requested verification profile
        required: true
        default: full
        type: choice
        options:
          - full
          - ielts
          - turtlebot4

permissions:
  contents: read

concurrency:
  group: joy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify branch without deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Verify repository
        env:
          JOY_DEV_PROJECT_ID: ${{ inputs.project_id }}
          JOY_DEV_SUITE: ${{ inputs.suite }}
        run: npm run verify

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
