name: Scratchpad Runtime Cleanup

on:
  push:
    branches:
      - cleanup/remove-scratchpad-runtime

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/remove-scratchpad-runtime
          fetch-depth: 0

      - name: Remove retired Scratchpad runtime
        run: python scripts/remove-scratchpad-runtime.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove retired Scratchpad runtime"
          git push origin HEAD:cleanup/remove-scratchpad-runtime
