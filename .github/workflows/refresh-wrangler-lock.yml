name: Refresh Wrangler lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-wrangler-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh Wrangler dependency and lockfile
        run: npm install --save-dev wrangler@4.131.2 --package-lock-only --ignore-scripts

      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update Wrangler to 4.131.2"
          git push origin HEAD:main
