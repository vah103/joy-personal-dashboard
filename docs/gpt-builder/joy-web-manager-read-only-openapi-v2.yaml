openapi: 3.1.0
info:
  title: Joy Web Manager Read-Only Actions
  version: 1.0.2
  description: Read-only actions for inspecting current Joy project and repository state. No write, branch, commit, pull-request, migration, or deployment operations are exposed.
servers:
  - url: https://app.hey-joy.workers.dev
security:
  - bearerAuth: []
paths:
  /api/joy/v1/overview:
    get:
      operationId: getJoyOverview
      summary: Get the current Joy overview
      description: Read current projects, open tasks, inbox tasks, and recent logs.
      responses:
        '200':
          description: Current Joy overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      additionalProperties: true
                  openTasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      additionalProperties: true
                  inboxTasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      additionalProperties: true
                  recentLogs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      additionalProperties: true
                  generatedAt:
                    type: integer
                additionalProperties: true
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '503':
          description: Service unavailable
  /api/joy/v1/projects:
    get:
      operationId: listJoyProjects
      summary: List Joy projects
      responses:
        '200':
          description: Joy projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        status:
                          type: string
                      additionalProperties: true
                additionalProperties: true
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '503':
          description: Service unavailable
  /api/joy/v1/projects/{projectId}:
    get:
      operationId: getJoyProject
      summary: Get one Joy project
      description: Read one project and its related records before discussing that project.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Stable lowercase Joy project ID, for example ielts or turtlebot4.
          schema:
            type: string
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      status:
                        type: string
                    additionalProperties: true
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      additionalProperties: true
                  milestones:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      additionalProperties: true
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      additionalProperties: true
                  evidence:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                      additionalProperties: true
                additionalProperties: true
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '404':
          description: Project not found
        '503':
          description: Service unavailable
  /api/joy/v1/workspaces/{projectId}:
    get:
      operationId: bootstrapJoyWorkspace
      summary: Load one Joy project workspace
      description: Load project state, memory, sessions, decisions, blockers, evidence, repository references, and continuation guidance.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Workspace state
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                    additionalProperties: true
                  memory:
                    type: object
                    properties:
                      snapshot:
                        type: object
                        properties:
                          summary:
                            type: string
                        additionalProperties: true
                    additionalProperties: true
                  continuation:
                    type: object
                    properties:
                      status:
                        type: string
                      currentGoal:
                        type: string
                      latestSummary:
                        type: string
                    additionalProperties: true
                  assistantProfile:
                    type: object
                    properties:
                      profileId:
                        type: string
                    additionalProperties: true
                additionalProperties: true
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '404':
          description: Workspace not found
        '503':
          description: Service unavailable
  /api/joy/v1/dev/repository:
    get:
      operationId: getJoyRepositoryContext
      summary: Read current repository context
      description: Call before repository or code analysis.
      parameters:
        - name: repository
          in: query
          required: false
          description: Repository in owner/name form. Defaults to the Joy repository.
          schema:
            type: string
            maxLength: 240
      responses:
        '200':
          description: Repository context
          content:
            application/json:
              schema:
                type: object
                properties:
                  repository:
                    type: string
                  defaultBranch:
                    type: string
                  mainHeadSha:
                    type: string
                  openPullRequests:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: integer
                        title:
                          type: string
                      additionalProperties: true
                  policy:
                    type: object
                    properties:
                      defaultBranch:
                        type: string
                    additionalProperties: true
                additionalProperties: true
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '503':
          description: Service unavailable
  /api/joy/v1/dev/search:
    get:
      operationId: searchJoyRepository
      summary: Search the Joy repository
      description: Search file names, symbols, visible UI text, routes, tests, or error messages.
      parameters:
        - name: repository
          in: query
          required: false
          schema:
            type: string
            maxLength: 240
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
      responses:
        '200':
          description: Repository search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  repository:
                    type: string
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        name:
                          type: string
                        snippet:
                          type: string
                      additionalProperties: true
                additionalProperties: true
        '400':
          description: Invalid query
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '503':
          description: Service unavailable
  /api/joy/v1/dev/files:
    get:
      operationId: readJoyRepositoryFile
      summary: Read one current repository file
      description: Read one UTF-8 file from main or a work branch after repository search.
      parameters:
        - name: repository
          in: query
          required: false
          schema:
            type: string
            maxLength: 240
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1000
        - name: ref
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Repository file
          content:
            application/json:
              schema:
                type: object
                properties:
                  repository:
                    type: string
                  path:
                    type: string
                  ref:
                    type: string
                  blobSha:
                    type: string
                  size:
                    type: integer
                  content:
                    type: string
                  htmlUrl:
                    type: string
                additionalProperties: true
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '404':
          description: File not found
        '413':
          description: File too large
        '503':
          description: Service unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
